<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben Quick 2026 Birthday Scavenger Hunt</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/scavenger-hunt-2026.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="main-wrapper">
        <div class="body-wrapper">
            <header>
                <h1 id="main-header">Welcome to Ben Quick 2026 Scavenger Hunt</h1>
            </header>
            <div class="box">
                <div class="title">Phase 1 Password</div>
                <div class="close-button"></div>
                <div class="body" style="display: flex; gap: 0.5rem;">
                    <span>Password: </span>
                    <span><input class="textbox" type="password" id="pass1Text"></span>
                    <button class="button" id="pass1Btn">Enter</button>
                </div>
            </div>
            <div class="box">
              <div class="title">Phase 2 Passcode</div>
              <div class="close-button"></div>
              <div class="body" style="display: flex; gap: 0.5rem; align-items: center;">
                <span>Passcode: </span>
                    <span><input class="textbox pass2-input" inputmode="text" type="text" maxlength="1" id="pass2-0" data-real="" autocomplete="off"></span>
                    <span><input class="textbox pass2-input" inputmode="text" type="text" maxlength="1" id="pass2-1" data-real="" autocomplete="off"></span>
                    <span><input class="textbox pass2-input" inputmode="text" type="text" maxlength="1" id="pass2-2" data-real="" autocomplete="off"></span>
                    <span><input class="textbox pass2-input" inputmode="text" type="text" maxlength="1" id="pass2-3" data-real="" autocomplete="off"></span>
                    <span><input class="textbox pass2-input" inputmode="text" type="text" maxlength="1" id="pass2-4" data-real="" autocomplete="off"></span>
                <button class="button" id="pass2Btn">Enter</button>
              </div>
            </div>
        </div>
    </div>
    <script src="./scavenger-hunt-2026.js" defer></script>
  </body>
</html>
